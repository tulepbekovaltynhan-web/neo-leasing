<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neo Leasing</title>
<meta name="description" content="Демо-прототип Neo Leasing: подбор автомобиля и лизинг в одном приложении">
<meta name="theme-color" content="#F6F4FB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Neo Leasing">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Neo Leasing v4 — Aurora (light) + Configurator (dark). Layout: phone-shaped device; screens = scroll area + floating glass tab bar; overlays and sheets inside device. */
:root{
  --violet:#6B2BE0; --violet-2:#8B5CF6; --deep:#4A12B8; --mint:#00B886; --mint-2:#00C08B; --lav:#B79CFF; --lav-soft:#EFE9FF;
  --bg:#F6F4FB; --bg-2:#FFFFFF; --card:#FFFFFF; --fg:#14101F; --muted:#6E6886; --line:rgba(20,16,31,.08); --chip:#FFFFFF;
  --glass:rgba(255,255,255,.72); --glass-line:rgba(255,255,255,.75); --shadow:0 10px 30px -12px rgba(30,10,80,.22);
  --aur:radial-gradient(120% 55% at 0% 0%,#E4D7FF 0%,transparent 55%),radial-gradient(90% 45% at 100% 22%,#CFF5EA 0%,transparent 60%);
  --link:#6B2BE0; --warn:#B26A00; --danger:#D23B53; --ok:#00A578;
  --pay-grad:linear-gradient(135deg,#7C3AED,#5B21B6 55%,#0F9F7A);
  --cta:rgba(20,16,31,.92); --page:#E9E6F2; --skel:#ECE8F4; --skel-hi:rgba(255,255,255,.65);
  --font:"Onest","Helvetica Neue",Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D0A15; --bg-2:#141020; --card:#17121F; --fg:#F3F0FA; --muted:#9A92B3; --line:rgba(255,255,255,.08); --chip:#1B1626; --lav-soft:#221A36;
  --glass:rgba(30,24,44,.66); --glass-line:rgba(255,255,255,.08); --shadow:0 10px 30px -12px rgba(0,0,0,.7);
  --aur:radial-gradient(120% 55% at 0% 0%,rgba(124,58,237,.22) 0%,transparent 55%),radial-gradient(90% 45% at 100% 22%,rgba(0,192,139,.10) 0%,transparent 60%);
  --link:#C4ADFF; --warn:#F0B04A; --ok:#3DE3B0; --pay-grad:linear-gradient(140deg,#2A1650,#1A0F33); --cta:rgba(26,22,38,.82); --page:#05040A; --skel:#1A1525; --skel-hi:rgba(255,255,255,.05);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D0A15; --bg-2:#141020; --card:#17121F; --fg:#F3F0FA; --muted:#9A92B3; --line:rgba(255,255,255,.08); --chip:#1B1626; --lav-soft:#221A36;
  --glass:rgba(30,24,44,.66); --glass-line:rgba(255,255,255,.08); --shadow:0 10px 30px -12px rgba(0,0,0,.7);
  --aur:radial-gradient(120% 55% at 0% 0%,rgba(124,58,237,.22) 0%,transparent 55%),radial-gradient(90% 45% at 100% 22%,rgba(0,192,139,.10) 0%,transparent 60%);
  --link:#C4ADFF; --warn:#F0B04A; --ok:#3DE3B0; --pay-grad:linear-gradient(140deg,#2A1650,#1A0F33); --cta:rgba(26,22,38,.82); --page:#05040A; --skel:#1A1525; --skel-hi:rgba(255,255,255,.05);
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--page);color:var(--fg);font-family:var(--font);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
img{-webkit-touch-callout:none;-webkit-user-drag:none;user-select:none}
:focus-visible{outline:2px solid var(--violet-2);outline-offset:2px}
.note{font-size:12px;color:var(--muted);text-align:center;max-width:400px;margin:0}
.device{position:relative;width:min(400px,100%);flex:1 1 auto;min-height:0;max-height:860px;background:var(--bg);background-image:var(--aur);border-radius:40px;overflow:hidden;
  box-shadow:0 0 0 10px #16121F,0 30px 60px -20px rgba(36,20,84,.45);isolation:isolate}
body.big .device{font-size:17px}
@media (max-width:520px){.device{border-radius:22px;box-shadow:0 0 0 1px var(--line)} .note{display:none} body{padding-block:8px}}
.screen{position:absolute;inset:0;display:flex;flex-direction:column}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;padding-bottom:110px}
.pad{padding:0 18px;display:flex;flex-direction:column;gap:14px}
.hdr{display:flex;align-items:center;gap:10px;padding:14px 18px 10px;flex:none;position:relative;z-index:3}
.hdr h1{font-size:28px;font-weight:800;letter-spacing:-.8px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo{display:inline-flex;align-items:center;font-weight:800;font-size:22px;letter-spacing:-.6px;line-height:1}
.logo .o{display:inline-block;width:17px;height:17px;border-radius:50%;border:3.8px solid var(--violet);position:relative;margin:0 1px;flex:none}
.logo .o::after{content:"";position:absolute;left:50%;top:50%;width:4.5px;height:4.5px;margin:-2.25px 0 0 -2.25px;border-radius:50%;background:var(--mint-2)}
.logo i{font-style:normal;font-weight:400;margin-left:5px}
:root[data-theme="dark"] .logo .o{border-color:var(--lav)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo .o{border-color:var(--lav)}}
.ibtn{width:44px;height:44px;border-radius:50%;border:0;display:grid;place-items:center;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:inset 0 0 0 1px var(--glass-line),var(--shadow);position:relative;flex:none;color:var(--fg)}
.ibtn svg{width:21px;height:21px}
.dotb{position:absolute;top:6px;right:6px;min-width:17px;height:17px;border-radius:9px;background:var(--danger);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 4px;box-shadow:0 0 0 2px var(--bg)}
/* glass tab bar */
.tab{position:absolute;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));height:66px;border-radius:33px;display:flex;align-items:center;justify-content:space-around;padding:0 7px;z-index:20;
  background:var(--glass);backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6);box-shadow:inset 0 0 0 1px var(--glass-line),var(--shadow)}
.tab button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--fg);opacity:.55;width:78px;height:52px;border-radius:26px;position:relative;transition:opacity .2s}
.tab button svg{width:22px;height:22px}
.tab button[aria-current="true"]{opacity:1;color:#fff}
.tab .pill{position:absolute;top:7px;height:52px;width:78px;border-radius:26px;background:var(--violet);transition:transform .35s cubic-bezier(.3,1.3,.5,1);z-index:-1;box-shadow:0 6px 18px -6px rgba(107,43,224,.7)}
:root[data-theme="dark"] .tab .pill{background:linear-gradient(135deg,#7C3AED,#A855F7);box-shadow:0 0 22px rgba(168,85,247,.55)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tab .pill{background:linear-gradient(135deg,#7C3AED,#A855F7);box-shadow:0 0 22px rgba(168,85,247,.55)}}
.tab .bdg{position:absolute;top:4px;left:50%;margin-left:8px;min-width:16px;height:16px;border-radius:8px;background:var(--mint-2);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 4px}
/* buttons */
.btn{border:0;border-radius:18px;padding:15px 18px;font-weight:700;font-size:15.5px;background:var(--violet);color:#fff;width:100%;transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn.sec{background:var(--lav-soft);color:var(--link)}
.btn.ghost{background:none;color:var(--muted);font-weight:500;padding:10px}
.btn.link{background:none;color:var(--link);padding:6px;font-weight:600;font-size:14px;width:auto}
.btn:disabled{opacity:.45}
.row{display:flex;gap:8px;align-items:center}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.muted{color:var(--muted)} .small{font-size:12.5px} .center{text-align:center}
.sec-t{display:flex;justify-content:space-between;align-items:baseline;margin:6px 2px -4px;font-size:18px;font-weight:700;letter-spacing:-.3px}
.sec-t button{border:0;background:none;color:var(--link);font-size:13.5px;font-weight:600;padding:4px}
/* stories */
.stories{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:2px 18px 2px}
.stories::-webkit-scrollbar{display:none}
.st{flex:none;width:62px;border:0;background:none;padding:0;text-align:center;font-size:11px;font-weight:600;color:var(--fg)}
.st .r{width:62px;height:62px;border-radius:50%;padding:2.5px;background:conic-gradient(var(--violet),var(--mint-2),var(--lav),var(--violet))}
.st.seen .r{background:var(--line)}
.st .r img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:2.5px solid var(--bg);display:block}
.st span{display:block;margin-top:5px;line-height:1.15}
/* pay card */
.paycard{border-radius:28px;padding:18px 20px 16px;background:var(--pay-grad);color:#fff;position:relative;overflow:hidden;box-shadow:0 18px 40px -22px rgba(91,33,182,.8)}
:root[data-theme="dark"] .paycard{box-shadow:inset 0 0 0 1px rgba(183,156,255,.18)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .paycard{box-shadow:inset 0 0 0 1px rgba(183,156,255,.18)}}
.paycard .q{font-size:14px;opacity:.85;font-weight:500}
.paycard .v{font-size:42px;font-weight:800;letter-spacing:-1.6px;margin:2px 0 0;font-variant-numeric:tabular-nums}
.paycard .v small{font-size:17px;font-weight:600;opacity:.75;letter-spacing:0}
.paycard input[type=range]{width:100%;margin:10px 0 6px;-webkit-appearance:none;appearance:none;height:8px;border-radius:4px;background:linear-gradient(90deg,#fff var(--p,40%),rgba(255,255,255,.25) var(--p,40%));outline:none}
.paycard input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.35);cursor:pointer}
.paycard input[type=range]::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:#fff;border:0}
.paycard .meta{display:flex;justify-content:space-between;font-size:12.5px;opacity:.85}
.paycard .meta button{border:0;background:rgba(255,255,255,.18);color:#fff;border-radius:10px;padding:4px 9px;font-size:12px;font-weight:600}
.paycard .cnt{margin-top:12px;display:flex;align-items:center;gap:10px;font-size:14.5px;font-weight:700;border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:16px;padding:9px 12px 9px 10px;width:100%;text-align:left}
.thumbs{display:flex}.thumbs img{width:30px;height:30px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.9);margin-left:-9px}.thumbs img:first-child{margin:0}
/* search */
.search{display:flex;align-items:center;gap:10px;height:52px;border-radius:18px;padding:0 8px 0 16px;background:var(--card);box-shadow:var(--shadow)}
.search svg{width:20px;height:20px;flex:none;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:15.5px;height:100%}
.search input::placeholder{color:var(--muted)}
.search .x{border:0;background:none;color:var(--muted);font-size:18px;padding:6px}
.search .fbtn{width:38px;height:38px;border-radius:12px;border:0;background:var(--lav-soft);color:var(--link);display:grid;place-items:center;position:relative;flex:none}
.search .fbtn svg{width:18px;height:18px;color:var(--link)}
.search .fbtn .dotb{top:-5px;right:-5px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:2px 18px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;padding:9px 14px;border-radius:20px;font-size:13.5px;font-weight:600;white-space:nowrap;background:var(--chip);box-shadow:0 1px 4px rgba(20,10,60,.07);color:var(--fg)}
:root[data-theme="dark"] .chip{box-shadow:inset 0 0 0 1px var(--line)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip{box-shadow:inset 0 0 0 1px var(--line)}}
.chip[aria-pressed="true"],.chip.on{background:var(--violet);color:#fff}
.understood{font-size:12.5px;color:var(--muted);margin:-6px 2px 0}
.understood b{color:var(--fg)}
/* bento */
.bento{display:grid;grid-template-columns:1.2fr 1fr;grid-template-rows:104px 104px;gap:10px}
.bx{border:0;border-radius:22px;padding:14px;position:relative;overflow:hidden;font-weight:700;font-size:15px;line-height:1.15;text-align:left;background:var(--card);color:var(--fg);box-shadow:var(--shadow);display:flex;flex-direction:column;justify-content:flex-end}
.bx small{display:block;font-size:11.5px;font-weight:500;color:var(--muted);margin-top:4px}
.bx.big{grid-row:span 2;color:#fff}
.bx.big img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bx.big::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,rgba(0,0,0,.72));z-index:1}
.bx.big span{position:relative;z-index:2}.bx.big small{color:rgba(255,255,255,.8)}
.bx .ic{width:32px;height:32px;border-radius:11px;display:grid;place-items:center;color:#fff;position:absolute;top:14px;left:14px}
.bx .ic svg{width:17px;height:17px}
/* horizontal mini cards */
.hscroll{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:2px 18px 6px}
.hscroll::-webkit-scrollbar{display:none}
.mc{flex:none;width:158px;border:0;padding:0;border-radius:20px;overflow:hidden;background:var(--card);text-align:left;box-shadow:var(--shadow);color:var(--fg)}
.mc img{width:100%;height:96px;object-fit:cover;display:block}
.mc div{padding:9px 11px 11px;font-size:12px;color:var(--muted)}.mc b{display:block;color:var(--fg);font-size:14px;margin-bottom:2px}
.mc .pay{font-size:16px;font-weight:800;color:var(--link)}
/* deal progress */
.progress{border:0;width:100%;text-align:left;display:flex;align-items:center;gap:12px;background:var(--card);border-radius:20px;padding:12px 14px;box-shadow:var(--shadow);color:var(--fg)}
.progress .ring{width:42px;height:42px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;background:conic-gradient(var(--mint-2) var(--pp),var(--line) 0)}
.progress .ring span{width:34px;height:34px;border-radius:50%;background:var(--card);display:grid;place-items:center}
.progress b{display:block;font-size:14.5px}.progress small{color:var(--muted);font-size:12.5px}
/* photo cards (feed) */
.feed{display:flex;flex-direction:column;gap:12px}
.fc{border-radius:30px;overflow:hidden;position:relative;height:310px;color:#fff;background:#222;box-shadow:var(--shadow);user-select:none;-webkit-user-select:none;touch-action:pan-y}
.fc.dim{opacity:.55}
.fc img.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fc::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.18) 0%,transparent 28%,transparent 45%,rgba(0,0,0,.8));z-index:1;pointer-events:none}
.fc .open{position:absolute;inset:0;border:0;background:none;z-index:2;padding:0}
.tg{position:absolute;left:14px;top:14px;display:flex;gap:6px;z-index:3;flex-wrap:wrap;right:64px;pointer-events:none}
.tg span{font-size:11.5px;font-weight:700;padding:5px 10px;border-radius:12px;background:rgba(255,255,255,.22);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:#fff}
.tg span.g{background:rgba(0,184,134,.92)} .tg span.ad{background:rgba(255,214,102,.95);color:#4A3500} .tg span.m{background:rgba(107,43,224,.92)}
.hrt{position:absolute;right:14px;top:14px;width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.22);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:grid;place-items:center;z-index:4;color:#fff}
.hrt svg{width:21px;height:21px}
.hrt[aria-pressed="true"]{background:#fff;color:var(--danger)}
.fc .bt{position:absolute;left:18px;right:18px;bottom:16px;z-index:3;pointer-events:none}
.fc .bt b{font-size:22px;font-weight:700;letter-spacing:-.4px;display:block}
.fc .bt .s{font-size:12.5px;opacity:.85;margin-top:2px}
.fc .bt .p{display:flex;justify-content:space-between;align-items:flex-end;margin-top:8px;gap:8px}
.fc .bt .pay{font-size:26px;font-weight:800;letter-spacing:-.8px;font-variant-numeric:tabular-nums}.fc .bt .pay small{font-size:13px;font-weight:600;opacity:.8;letter-spacing:0}
.fc .bt .pr{font-size:12px;opacity:.85;text-align:right}
.mkt{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:4px 8px;border-radius:10px;background:rgba(0,192,139,.28);color:#9CF7DB;margin-top:6px}
.warnline{font-size:11.5px;font-weight:700;color:#FFD48A;margin-top:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 .fc{height:210px;border-radius:22px}
.grid2 .fc .bt b{font-size:15px}.grid2 .fc .bt .pay{font-size:17px}.grid2 .fc .bt .s,.grid2 .fc .mkt,.grid2 .fc .bt .pr{display:none}
.grid2 .tg{right:48px}.grid2 .tg span{font-size:10px;padding:3px 7px}.grid2 .hrt{width:34px;height:34px;right:8px;top:8px}
.seg{display:flex;padding:4px;border-radius:14px;gap:2px;background:var(--card);box-shadow:var(--shadow)}
.seg button{border:0;background:none;width:38px;height:32px;border-radius:10px;display:grid;place-items:center;color:var(--fg);opacity:.55}
.seg button svg{width:17px;height:17px}
.seg button[aria-pressed="true"]{opacity:1;background:var(--lav-soft);color:var(--link)}
.seg.txt button{width:auto;padding:0 12px;font-size:13px;font-weight:600}
.sortrow{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
.sortrow select{border:0;border-radius:10px;padding:6px 8px;background:var(--card);font-size:13px;box-shadow:var(--shadow)}
/* skeleton */
.sk{border-radius:30px;height:300px;position:relative;overflow:hidden;background:var(--skel)}
.sk::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,var(--skel-hi) 50%,transparent 70%);animation:shim 1.1s linear infinite;transform:translateX(-100%)}
@keyframes shim{to{transform:translateX(100%)}}
.ptr{height:0;display:grid;place-items:center;overflow:hidden;color:var(--muted);font-size:12.5px;transition:height .2s}
/* swipe deck */
.deck{position:relative;flex:1;margin:4px 18px 0;min-height:0}
.scard{position:absolute;inset:0 0 96px;border-radius:32px;overflow:hidden;color:#fff;background:#222;box-shadow:0 20px 40px -18px rgba(20,10,60,.55);touch-action:pan-y;user-select:none;-webkit-user-select:none}
.scard.back{transform:scale(.94) translateY(14px);opacity:.7}
.scard img.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scard::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.15),transparent 30%,transparent 45%,rgba(0,0,0,.85));z-index:1}
.scard .bt{position:absolute;left:20px;right:20px;bottom:20px;z-index:2}
.scard .bt b{font-size:26px;font-weight:800;letter-spacing:-.6px;display:block}
.scard .bt .s{font-size:13px;opacity:.85;margin-top:3px;line-height:1.4}
.scard .bt .pay{font-size:30px;font-weight:800;letter-spacing:-1px;margin-top:10px}.scard .bt .pay small{font-size:14px;font-weight:600;opacity:.8}
.scard .bt .tt{font-size:12px;opacity:.8}
.scard .more{position:absolute;right:16px;bottom:22px;z-index:3;border:0;border-radius:16px;padding:10px 14px;font-weight:700;font-size:13px;background:rgba(255,255,255,.22);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:#fff}
.stamp{position:absolute;top:24px;padding:5px 12px;border:3px solid;border-radius:10px;font-weight:800;font-size:22px;opacity:0;letter-spacing:1px;z-index:3}
.stamp.like{left:18px;color:#3DE3B0;border-color:#3DE3B0;transform:rotate(-12deg)}
.stamp.nope{right:18px;color:#FF6B81;border-color:#FF6B81;transform:rotate(12deg)}
.dact{position:absolute;left:0;right:0;bottom:6px;display:flex;justify-content:center;gap:18px;align-items:center}
.round{width:62px;height:62px;border-radius:50%;border:0;background:var(--card);display:grid;place-items:center;box-shadow:var(--shadow);transition:transform .12s}
.round:active{transform:scale(.9)}
.round svg{width:27px;height:27px}
.round.small{width:48px;height:48px}.round.small svg{width:20px;height:20px}
.round.no{color:var(--danger)}.round.yes{color:#fff;background:var(--violet)}.round.undo{color:var(--muted)}
.cnt-line{text-align:center;font-size:12.5px;color:var(--muted);margin-top:-4px}
/* overlays */
.ov{position:absolute;inset:0;z-index:30;background:var(--bg);background-image:var(--aur);display:flex;flex-direction:column;animation:ovIn .3s cubic-bezier(.2,.8,.2,1)}
@keyframes ovIn{from{transform:translateX(30px);opacity:.4}to{transform:none;opacity:1}}
.ov.zoom{animation:zoomIn .32s cubic-bezier(.2,.8,.2,1)}
@keyframes zoomIn{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
.ov .hdr{padding-top:calc(14px + env(safe-area-inset-top,0px))}
.ov .hdr h1{font-size:22px}
.back{width:44px;height:44px;border-radius:50%;border:0;display:grid;place-items:center;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:inset 0 0 0 1px var(--glass-line);color:var(--fg);flex:none}
.back svg{width:22px;height:22px}
/* detail */
.det{position:absolute;inset:0;z-index:30;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;background:var(--tint,var(--bg));animation:zoomIn .32s cubic-bezier(.2,.8,.2,1)}
.det .heroW{position:relative;height:440px;overflow:hidden}
.det .gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;height:100%}
.det .gal::-webkit-scrollbar{display:none}
.det .gal img{flex:0 0 100%;width:100%;height:100%;object-fit:cover;scroll-snap-align:center;display:block}
.det .heroW::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.35),transparent 22%,transparent 62%,var(--tint,var(--bg)))}
.det .nav{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:16px;right:16px;display:flex;justify-content:space-between;z-index:4}
.det .nav .gr{display:flex;gap:10px}
.det .nav .back,.det .nav .ibtn{background:rgba(255,255,255,.24);color:#fff;box-shadow:none}
.det .nav .ibtn[aria-pressed="true"]{background:#fff;color:var(--danger)}
.gdots{position:absolute;bottom:26px;left:0;right:0;display:flex;justify-content:center;gap:6px;z-index:3}
.gdots i{width:7px;height:7px;border-radius:4px;background:rgba(255,255,255,.55);transition:width .2s}.gdots i.on{width:20px;background:#fff}
.det .body{position:relative;padding:4px 18px 130px;display:flex;flex-direction:column;gap:14px;margin-top:-18px;z-index:2}
.det h2{font-size:30px;font-weight:800;letter-spacing:-.9px;margin:0;line-height:1.05}
.det .sub{font-size:13.5px;color:var(--muted);margin-top:4px}
.pricerow{display:flex;justify-content:space-between;align-items:baseline}
.pricerow b{font-size:20px;font-weight:800}
.colors{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--muted)}
.colors i{width:28px;height:28px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15),0 0 0 2px var(--tint,var(--bg)),0 0 0 4px var(--violet)}
.facts{display:flex;gap:8px;flex-wrap:wrap}
.facts span,.facts button{font-size:12.5px;font-weight:600;padding:8px 12px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);border:0;color:var(--fg)}
.facts .good{color:var(--ok)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border:0;border-radius:20px;padding:12px 14px;text-align:left;background:var(--card);box-shadow:var(--shadow);font-size:12px;color:var(--muted);line-height:1.3}
.tile b{display:block;font-size:16px;color:var(--fg);margin-bottom:2px}
.tile b.ok{color:var(--ok)}.tile b.mid{color:var(--warn)}.tile b.low{color:var(--danger)}
.card{background:var(--card);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.card h3{margin:0;font-size:17px}
.big{font-size:30px;font-weight:800;letter-spacing:-1px;font-variant-numeric:tabular-nums;color:var(--link)}
.big small{font-size:14px;font-weight:600}
label.f,.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.val{font-size:18px;font-weight:700;color:var(--fg);font-variant-numeric:tabular-nums}
.val small{font-size:12.5px;color:var(--muted);font-weight:500}
input[type=range]{width:100%;accent-color:var(--violet)}
.kv{display:grid;grid-template-columns:1fr auto;gap:7px 12px;font-size:13.5px;margin:0}
.kv dt{color:var(--muted)}.kv dd{margin:0;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.specgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.spec{background:var(--card);border-radius:14px;padding:9px 12px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow)}
.spec b{color:var(--fg);font-size:14px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{font-size:12.5px;background:var(--card);padding:6px 10px;border-radius:10px;box-shadow:var(--shadow)}
.disc{font-size:11.5px;color:var(--muted);line-height:1.45;margin:0}
.warnbox{background:rgba(178,106,0,.1);color:var(--warn);border-radius:14px;padding:10px 12px;font-size:12.5px;font-weight:600;line-height:1.4}
.okbox{background:rgba(0,184,134,.12);color:var(--ok);border-radius:14px;padding:10px 12px;font-size:12.5px;font-weight:600}
.cta{position:absolute;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));border-radius:30px;padding:12px 12px 12px 22px;display:flex;align-items:center;justify-content:space-between;gap:10px;z-index:35;
  background:var(--cta);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);color:#fff;box-shadow:0 14px 30px -12px rgba(20,10,60,.6)}
.cta .pay{font-size:24px;font-weight:800;letter-spacing:-.6px;font-variant-numeric:tabular-nums}.cta .pay small{font-size:12.5px;font-weight:600;opacity:.75}
.cta .why{border:0;background:none;color:#fff;opacity:.75;font-size:11.5px;text-decoration:underline;text-underline-offset:3px;padding:0}
.cta .go{height:52px;padding:0 22px;border-radius:26px;border:0;font-weight:700;font-size:15px;background:var(--violet);color:#fff;flex:none}
:root[data-theme="dark"] .cta .go{background:linear-gradient(135deg,#7C3AED,#A855F7);box-shadow:0 0 24px rgba(168,85,247,.6)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .cta .go{background:linear-gradient(135deg,#7C3AED,#A855F7);box-shadow:0 0 24px rgba(168,85,247,.6)}}
.tbl-wrap{overflow-x:auto;border-radius:14px;box-shadow:var(--shadow);background:var(--card)}
table{border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums;width:100%}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
thead th{color:var(--muted);font-weight:600}
/* sheets */
.scrim{position:absolute;inset:0;background:rgba(10,6,24,.45);z-index:50;display:flex;align-items:flex-end;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--bg-2);background-image:var(--aur);width:100%;max-height:calc(100% - 24px - env(safe-area-inset-top,0px));border-radius:28px 28px 0 0;display:flex;flex-direction:column;animation:up .32s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom,0px)}
@keyframes up{from{transform:translateY(60px);opacity:.5}to{transform:none;opacity:1}}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 0;flex:none}
.sheet .sh{display:flex;align-items:center;gap:10px;padding:10px 18px 8px;flex:none}
.sheet .sh h2{flex:1;margin:0;font-size:20px;font-weight:800;letter-spacing:-.4px}
.sheet .sb{overflow-y:auto;padding:4px 18px 18px;display:flex;flex-direction:column;gap:14px}
.sheet .sf{padding:10px 18px 16px;display:flex;flex-direction:column;gap:8px;flex:none}
.xbtn{width:36px;height:36px;border-radius:50%;border:0;background:var(--lav-soft);color:var(--fg);display:grid;place-items:center}
.xbtn svg{width:18px;height:18px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13px}
.check input{width:19px;height:19px;accent-color:var(--violet);flex:none;margin-top:1px}
.inp{border:0;border-radius:14px;padding:12px 14px;background:var(--card);width:100%;font-size:15.5px;box-shadow:var(--shadow)}
.meter{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;border-radius:5px;transition:width .4s,background .4s}
.segbar{display:flex;background:var(--card);border-radius:14px;padding:3px;box-shadow:var(--shadow)}
.segbar button{flex:1;border:0;background:none;border-radius:11px;padding:9px;font-size:13px;font-weight:600;color:var(--muted)}
.segbar button[aria-pressed="true"]{background:var(--violet);color:#fff}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:15px;font-weight:600;background:none;border:0;padding:0;width:100%;text-align:left;color:var(--fg)}
.switch small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.switch .tg2{width:48px;height:28px;border-radius:14px;background:var(--line);position:relative;flex:none;transition:background .2s}
.switch .tg2::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch[aria-checked="true"] .tg2{background:var(--violet)}.switch[aria-checked="true"] .tg2::after{transform:translateX(20px)}
.li{display:flex;align-items:center;gap:12px;padding:12px 2px;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left;font-size:14.5px;color:var(--fg)}
.li:last-child{border-bottom:0}
.li .ic{width:38px;height:38px;border-radius:12px;background:var(--lav-soft);display:grid;place-items:center;color:var(--link);flex:none}
.li .ic svg{width:19px;height:19px}
.li .g{flex:1;min-width:0}.li .g small{display:block;color:var(--muted);font-size:12px;margin-top:1px}
.pill2{font-size:11px;font-weight:700;border-radius:8px;padding:3px 8px;background:var(--lav-soft);color:var(--link);flex:none}
.pill2.ok{background:rgba(0,184,134,.14);color:var(--ok)}.pill2.warn{background:rgba(178,106,0,.14);color:var(--warn)}
/* fav rows */
.frow{display:flex;gap:12px;align-items:center;border-radius:20px;padding:8px;background:var(--card);box-shadow:var(--shadow);position:relative;overflow:hidden;touch-action:pan-y}
.frow img{width:96px;height:66px;border-radius:14px;object-fit:cover;flex:none}
.frow .g{flex:1;min-width:0;border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column;gap:2px;color:var(--fg)}
.frow .g b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.frow .g span{font-size:12.5px;color:var(--muted)}
.frow .g .p{font-size:15px;font-weight:800;color:var(--link)}
.del{width:38px;height:38px;border-radius:12px;border:0;background:var(--lav-soft);color:var(--muted);display:grid;place-items:center;flex:none}
.del svg{width:16px;height:16px}
/* compare h2h */
.h2h{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.h2h .cc{border-radius:22px;overflow:hidden;background:var(--card);box-shadow:var(--shadow);position:relative}
.h2h .cc img{width:100%;height:110px;object-fit:cover;display:block}
.h2h .cc select{width:100%;border:0;background:none;font-weight:700;font-size:13.5px;padding:8px 10px;color:var(--fg)}
.cmprow{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;font-size:13.5px;padding:9px 4px;border-bottom:1px solid var(--line)}
.cmprow:last-child{border-bottom:0}
.cmprow .l{text-align:left;font-weight:600}.cmprow .r{text-align:right;font-weight:600}.cmprow .m{color:var(--muted);font-size:11.5px;text-align:center;min-width:86px}
.cmprow .win{color:var(--ok)}.cmprow .lose{opacity:.55}
.verdict{border-radius:22px;padding:14px 16px;background:var(--pay-grad);color:#fff;font-size:14.5px;line-height:1.4}
.verdict b{font-size:16px;display:block;margin-bottom:3px}
/* notifications */
.nt{display:flex;gap:12px;padding:12px;border-radius:18px;background:var(--card);box-shadow:var(--shadow);border:0;width:100%;text-align:left;color:var(--fg)}
.nt.new{box-shadow:inset 3px 0 0 var(--violet),var(--shadow)}
.nt .ic{width:40px;height:40px;border-radius:12px;flex:none;display:grid;place-items:center;color:#fff}
.nt .ic svg{width:19px;height:19px}
.nt b{display:block;font-size:14px}.nt small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px;line-height:1.35}.nt time{font-size:11px;color:var(--muted)}
.empty{text-align:center;padding:40px 16px;display:flex;flex-direction:column;gap:10px;align-items:center;color:var(--muted)}
.empty .eic{width:72px;height:72px;border-radius:24px;background:var(--lav-soft);display:grid;place-items:center;color:var(--link)}
.empty .eic svg{width:34px;height:34px}
.empty b{color:var(--fg);font-size:17px}
/* story viewer */
.story{position:absolute;inset:0;z-index:60;background:#000;color:#fff;animation:fade .2s}
.story img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.story::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.5),transparent 25%,transparent 55%,rgba(0,0,0,.85));pointer-events:none}
.story .bars{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:12px;right:12px;display:flex;gap:4px;z-index:3}
.story .bars i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.35);overflow:hidden}
.story .bars i b{display:block;height:100%;width:0;background:#fff}
.story .bars i.done b{width:100%}
.story .bars i.cur b{animation:sbar 4s linear forwards}
@keyframes sbar{to{width:100%}}
.story .top{position:absolute;top:calc(26px + env(safe-area-inset-top,0px));left:14px;right:14px;display:flex;align-items:center;justify-content:space-between;z-index:3;font-weight:700}
.story .top button{border:0;background:rgba(255,255,255,.2);color:#fff;width:38px;height:38px;border-radius:50%;display:grid;place-items:center}
.story .tapL,.story .tapR{position:absolute;top:80px;bottom:160px;width:40%;z-index:2;border:0;background:none}
.story .tapL{left:0}.story .tapR{right:0}
.story .bt{position:absolute;left:20px;right:20px;bottom:calc(26px + env(safe-area-inset-bottom,0px));z-index:3}
.story .bt b{font-size:28px;font-weight:800;letter-spacing:-.6px;display:block}
.story .bt .pay{font-size:24px;font-weight:800;margin:6px 0 14px}
.story .bt .row button{flex:1}
/* peek */
.peek{position:absolute;inset:0;z-index:70;background:rgba(10,6,24,.35);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:grid;place-items:center;padding:24px;animation:fade .15s}
.peek .pc{width:100%;border-radius:28px;overflow:hidden;background:var(--card);box-shadow:0 30px 60px -20px rgba(0,0,0,.6);animation:pop .3s cubic-bezier(.2,1.4,.4,1)}
.peek .pc img{width:100%;height:220px;object-fit:cover;display:block}
.peek .pc .t{padding:14px 16px}
.peek .pc b{font-size:20px;display:block}
.peek .acts{display:flex;border-top:1px solid var(--line)}
.peek .acts button{flex:1;border:0;background:none;padding:14px;font-weight:700;color:var(--link);font-size:14.5px}
.peek .acts button+button{border-left:1px solid var(--line)}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
/* chat */
.msgs{display:flex;flex-direction:column;gap:8px}
.msg{max-width:80%;padding:10px 13px;border-radius:18px;font-size:14px;line-height:1.4}
.msg.me{align-self:flex-end;background:var(--violet);color:#fff;border-bottom-right-radius:6px}
.msg.them{align-self:flex-start;background:var(--card);box-shadow:var(--shadow);border-bottom-left-radius:6px}
.typing{display:inline-flex;gap:4px}.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:tp 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes tp{50%{transform:translateY(-4px);opacity:.5}}
/* share card */
.shcard{border-radius:24px;overflow:hidden;background:var(--pay-grad);color:#fff;box-shadow:var(--shadow)}
.shcard img{width:100%;height:180px;object-fit:cover;display:block}
.shcard .t{padding:14px 16px}
/* toast */
.toast{position:absolute;left:16px;right:16px;bottom:calc(92px + env(safe-area-inset-bottom,0px));background:#14101F;color:#fff;border-radius:16px;padding:12px 16px;font-size:14px;z-index:90;box-shadow:0 10px 24px -10px rgba(0,0,0,.5);animation:up .25s ease;display:flex;align-items:center;gap:10px}
.toast button{margin-left:auto;background:none;border:0;color:var(--lav);font-weight:800;padding:0;font-size:14px}
/* fab compare */
.fab{position:absolute;right:16px;bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:21;height:52px;border-radius:26px;padding:0 18px 0 8px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px;color:#fff;border:0;background:#14101F;box-shadow:0 12px 26px -8px rgba(20,10,60,.55);animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
:root[data-theme="dark"] .fab{background:linear-gradient(135deg,#7C3AED,#A855F7);box-shadow:0 0 28px rgba(168,85,247,.5)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .fab{background:linear-gradient(135deg,#7C3AED,#A855F7);box-shadow:0 0 28px rgba(168,85,247,.5)}}
.fab .th{display:flex}.fab .th img{width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid #14101F;margin-left:-11px}.fab .th img:first-child{margin:0}
/* coach marks */
.coach{position:absolute;inset:0;z-index:95;pointer-events:auto}
.coach .hole{position:absolute;border-radius:22px;box-shadow:0 0 0 2000px rgba(10,6,24,.62);transition:all .35s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.coach .tip{position:absolute;left:18px;right:18px;background:var(--bg-2);color:var(--fg);border-radius:20px;padding:14px 16px;box-shadow:0 20px 40px -10px rgba(0,0,0,.5);animation:pop .3s cubic-bezier(.2,1.4,.4,1)}
.coach .tip b{display:block;font-size:16px;margin-bottom:3px}
.coach .tip p{margin:0 0 10px;font-size:13.5px;color:var(--muted);line-height:1.4}
/* flow/app */
.steps{display:flex;flex-direction:column;margin:0;padding:0;list-style:none}
.steps li{display:flex;gap:12px;align-items:flex-start;padding-bottom:12px;position:relative}
.steps li:not(:last-child)::before{content:"";position:absolute;left:12px;top:26px;bottom:2px;width:2px;background:var(--line)}
.steps li.done:not(:last-child)::before{background:var(--mint-2)}
.steps .n{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:11px;font-weight:700;flex:none;background:var(--bg-2);color:var(--muted)}
.steps li.done .n{background:var(--mint-2);border-color:var(--mint-2);color:#fff}
.steps li.now .n{border-color:var(--violet);color:var(--link)}
.steps .t{font-size:14.5px;font-weight:600}.steps .s{font-size:12.5px;color:var(--muted)}
.steps li.todo .t{color:var(--muted);font-weight:500}
.demo{border:1.5px dashed var(--violet-2);color:var(--link);background:none;border-radius:16px;padding:12px;font-size:14px;font-weight:700;width:100%}
.ok-ic{width:66px;height:66px;border-radius:50%;background:var(--mint-2);display:grid;place-items:center;color:#fff;margin:4px auto 0;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.ok-ic svg{width:34px;height:34px}
.spinner{width:46px;height:46px;border-radius:50%;border:4px solid var(--lav-soft);border-top-color:var(--violet);animation:spin 1s linear infinite;margin:10px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slots .chip{justify-content:center;text-align:center}
.map{border-radius:22px;overflow:hidden;position:relative;box-shadow:var(--shadow)}
.map svg{display:block;width:100%;height:auto}

 var f=S.f;if(a==="fPrice"){f.priceMax=v;t$("fPriceV",fmt(v)+" BYN");}if(a==="fYear"){f.yearMin=v;t$("fYearV",v);}if(a==="fKm"){f.kmMax=v;t$("fKmV",fmt(v)+" км");}
 if(a[0]==="f")updF();}

/* ===== gestures ===== */
function bindGestures(){
 /* long-press peek */
 var lpT=null,lpX=0,lpY=0;
 app.addEventListener("pointerdown",function(e){var el=e.target.closest("[data-peek]");if(!el||e.target.closest(".hrt"))return;lpX=e.clientX;lpY=e.clientY;clearTimeout(lpT);
  lpT=setTimeout(function(){S.peek=+el.dataset.peek;noClickUntil=Date.now()+600;blip(520,1);render();},450);});
 app.addEventListener("pointermove",function(e){if(lpT&&(Math.abs(e.clientX-lpX)>8||Math.abs(e.clientY-lpY)>8)){clearTimeout(lpT);lpT=null;}});
 ["pointerup","pointercancel"].forEach(function(t){app.addEventListener(t,function(){clearTimeout(lpT);lpT=null;});});
 /* touch: edge-swipe back, pull-down close detail, pull-to-refresh */
 var g=null;
 app.addEventListener("touchstart",function(e){var t=e.touches[0],d=dev.getBoundingClientRect(),x=t.clientX-d.left;g=null;
  var top=topLayer();if(top&&x<24&&top!=="sheet"){g={k:"edge",x0:t.clientX,y0:t.clientY,el:topEl(top),top:top};return;}
  var det=e.target.closest("#det");if(det&&top==="det"&&det.scrollTop<=0&&!e.target.closest(".gal")){g={k:"pull",y0:t.clientY,x0:t.clientX,el:det};return;}
  var hs=e.target.closest("#homeScroll");if(hs&&!top&&hs.scrollTop<=0){g={k:"ptr",y0:t.clientY,x0:t.clientX,el:hs};}},{passive:true});
 app.addEventListener("touchmove",function(e){if(!g)return;var t=e.touches[0],dx=t.clientX-g.x0,dy=t.clientY-g.y0;g.dx=dx;g.dy=dy;
  if(g.k==="edge"){if(dx>0&&g.el){g.el.style.transition="none";g.el.style.transform="translateX("+dx+"px)";}}
  else if(g.k==="pull"){if(dy>0&&Math.abs(dy)>Math.abs(dx)&&g.el.scrollTop<=0){g.el.style.transition="none";g.el.style.transform="translateY("+(dy*.55)+"px) scale("+(1-Math.min(dy,300)/3000)+")";g.el.style.borderRadius="28px";}else g.dy=0;}
  else if(g.k==="ptr"){var p=document.getElementById("ptr");if(dy>0&&g.el.scrollTop<=0&&p){p.style.transition="none";p.style.height=Math.min(70,dy*.45)+"px";p.textContent=dy>130?"↻ Отпустите, чтобы обновить":"↓ Потяните, чтобы обновить";}}},{passive:true});
 app.addEventListener("touchend",function(){if(!g)return;var k=g;g=null;
  if(k.k==="edge"){if(k.dx>80){closeTop(k.top);render();}else if(k.el){k.el.style.transition="transform .2s";k.el.style.transform="";}}
  else if(k.k==="pull"){if(k.dy>120){S.detail=null;render();}else{k.el.style.transition="transform .2s";k.el.style.transform="";k.el.style.borderRadius="";}}
  else if(k.k==="ptr"){var p=document.getElementById("ptr");if(k.dy>130){if(p)p.textContent="Обновляем…";S.loading=true;setTimeout(function(){S.loading=false;render();toast("Каталог обновлён · "+cars(filtered().length));},700);}else if(p){p.style.transition="";p.style.height="0";}}},{passive:true});
}
function topLayer(){if(S.peek||S.story)return "modal";if(S.sheet)return "sheet";if(S.flow)return "flow";if(S.quiz)return "quiz";if(S.ov)return "ov";if(S.detail)return "det";return null;}
function topEl(t){if(t==="det")return document.getElementById("det");var l=document.querySelectorAll(".ov");return l[l.length-1];}
function closeTop(t){if(t==="det")S.detail=null;else if(t==="flow")A.closeFlow();else if(t==="quiz")S.quiz=null;else if(t==="ov")S.ov=null;else if(t==="modal"){S.peek=null;S.story=null;}}

/* swipe deck */
function bindSwipe(){var card=document.getElementById("top");if(!card)return;var x0=null,y0=0,dx=0,sL=card.querySelector(".stamp.like"),sN=card.querySelector(".stamp.nope");
 card.addEventListener("pointerdown",function(e){if(e.target.closest("button"))return;x0=e.clientX;y0=e.clientY;dx=0;try{card.setPointerCapture(e.pointerId);}catch(_){}card.style.transition="none";});
 card.addEventListener("pointermove",function(e){if(x0===null)return;dx=e.clientX-x0;var dy=e.clientY-y0;if(Math.abs(dx)<6&&Math.abs(dy)>10){x0=null;card.style.transform="";return;}card.style.transform="translateX("+dx+"px) rotate("+(dx/18)+"deg)";sL.style.opacity=Math.max(0,Math.min(1,dx/90));sN.style.opacity=Math.max(0,Math.min(1,-dx/90));});
 function end(){if(x0===null)return;x0=null;card.style.transition="transform .25s ease";
  if(Math.abs(dx)>90){var id=+card.dataset.id,right=dx>0;card.style.transform="translateX("+(right?520:-520)+"px) rotate("+(right?20:-20)+"deg)";setTimeout(function(){if(right)like(id,document.getElementById("likeBtn"));else nope(id);render();},180);}
  else{card.style.transform="";sL.style.opacity=0;sN.style.opacity=0;}}
 card.addEventListener("pointerup",end);card.addEventListener("pointercancel",end);
 card.addEventListener("keydown",function(e){if(e.key==="ArrowRight"){A.like();render();}if(e.key==="ArrowLeft"){A.nope();render();}});}
function afterRender(){placePill();bindSwipe();if(S.coach!=null&&!S.splash)placeCoach();}

/* ===== boot ===== */
function startSplash(){S.splash=true;setTimeout(function(){S.splashOut=true;render();setTimeout(function(){S.splash=false;S.splashOut=false;if(!lsGet("nl4coach")){S.tab="home";S.hv="home";S.coach=0;}render();},380);},2800);}
function boot(){app=document.getElementById("app");dev=document.getElementById("device");if(LITE)dev.classList.add("lite");applyTheme();
 if(window.matchMedia)try{matchMedia("(prefers-color-scheme: dark)").addEventListener("change",function(){if(S.theme==="system"){applyTheme();render();}});}catch(e){}
 bindEvents();render();startSplash();}
boot();

})();
