<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neo Leasing</title>
<meta name="description" content="Демо-прототип Neo Leasing: подбор автомобиля и лизинг в одном приложении">
<meta name="theme-color" content="#530AA7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Neo Leasing">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
/* Layout: phone-shaped prototype centred on the page; app inside = header, scroll area, bottom tab bar; overlays and sheets live inside the device. Brand: Neo Bank Asia. */
:root{
  --violet:#530AA7; --violet-2:#6F3CD5; --indigo:#241454; --lav:#BFAEFD; --lav-soft:#EFEAFE; --mint:#00B386;
  --bg:#FFFFFF; --page:#ECE8F6; --surface:#F6F4FB; --line:#E3DDF2; --fg:#241454; --muted:#6C6588; --link:#530AA7;
  --danger:#C62F45; --warn:#A86400; --card:#FFFFFF; --win:#2A2440; --tire:#1E1A2B;
  --map-bg:#F1EEF8; --map-road:#FFFFFF; --map-block:#E2DCF0; --map-park:#D5EFE6;
  --font:"Helvetica Neue",Helvetica,Arial,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#140C2E; --page:#0B0620; --surface:#1D1440; --line:#33285A; --fg:#F2EEFF; --muted:#A79FC9; --card:#1D1440; --link:#BFAEFD;
  --lav-soft:#2A1E57; --violet-2:#8F6FDD; --win:#0E0A1E; --warn:#E3A13B;
  --map-bg:#1A1238; --map-road:#2E2456; --map-block:#231A48; --map-park:#173A35; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#140C2E; --page:#0B0620; --surface:#1D1440; --line:#33285A; --fg:#F2EEFF; --muted:#A79FC9; --card:#1D1440; --link:#BFAEFD;
  --lav-soft:#2A1E57; --violet-2:#8F6FDD; --win:#0E0A1E; --warn:#E3A13B; --map-bg:#1A1238; --map-road:#2E2456; --map-block:#231A48; --map-park:#173A35; color-scheme:dark}
html,body{height:100%}
body{background:var(--page);color:var(--fg);font-family:var(--font);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;box-sizing:border-box}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--violet-2);outline-offset:2px}
.note{font-size:12px;color:var(--muted);text-align:center;max-width:400px;margin:0}
.device{position:relative;width:min(400px,100%);flex:1 1 auto;min-height:0;max-height:860px;background:var(--bg);border-radius:32px;overflow:hidden;display:flex;flex-direction:column;
  box-shadow:0 0 0 10px #17102e,0 30px 60px -20px rgba(36,20,84,.45)}
@media (max-width:520px){.device{border-radius:20px;box-shadow:0 0 0 1px var(--line)} .note{display:none} body{padding-block:8px}}
.hdr{padding:14px 16px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);background:var(--bg);flex:none}
.hdr h1{font-size:18px;margin:0;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo{display:inline-flex;align-items:center;font-weight:800;font-size:20px;letter-spacing:-.5px;color:var(--fg);line-height:1}
.logo .lo{display:inline-block;width:15px;height:15px;border-radius:50%;border:3.5px solid var(--violet);position:relative;margin:0 1px;box-sizing:border-box;flex:none}
.logo .lo::after{content:"";position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;border-radius:50%;background:var(--mint)}
.logo .ll{font-weight:400;margin-left:5px}
:root[data-theme="dark"] .logo .lo{border-color:var(--lav)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo .lo{border-color:var(--lav)}}
.logo.big{font-size:42px;letter-spacing:-1.2px;color:#fff}.logo.big .lo{width:32px;height:32px;border-width:7px;border-color:#fff;margin:0 2px}.logo.big .lo::after{width:9px;height:9px;margin:-4.5px 0 0 -4.5px}.logo.big .ll{color:#D9D1FB;margin-left:9px}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden}
.pad{padding:14px 16px 20px;display:flex;flex-direction:column;gap:14px}
.tabbar{flex:none;display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--bg);padding-bottom:6px}
.tabbar button{background:none;border:0;padding:8px 2px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);position:relative}
.tabbar button svg{width:22px;height:22px}
.tabbar button[aria-current="true"]{color:var(--link)}
.badge{position:absolute;top:3px;left:calc(50% + 6px);background:var(--mint);color:#fff;font-size:10px;font-weight:700;border-radius:9px;padding:1px 5px;min-width:16px}
.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:700;font-size:15px;background:var(--violet);color:#fff;width:100%;transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn.sec{background:var(--lav-soft);color:var(--link)}
.btn.ghost{background:none;color:var(--muted);font-weight:500;padding:8px}
.btn.link{background:none;color:var(--link);padding:4px;font-weight:600;font-size:14px}
.btn:disabled{opacity:.45}
.row{display:flex;gap:8px;align-items:center}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--bg);border-radius:20px;padding:7px 12px;font-size:13px;white-space:nowrap;display:flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--violet);border-color:var(--violet);color:#fff}
.dot{width:12px;height:12px;border-radius:50%;border:1px solid rgba(36,20,84,.25);flex:none}
.cond{display:flex;align-items:center;gap:8px;background:var(--lav-soft);border-radius:12px;padding:9px 12px;font-size:13px;border:0;width:100%;text-align:left}
.cond b{font-weight:700}
.cond .edit{margin-left:auto;color:var(--link);font-weight:700;font-size:12px;flex:none}
.modes{display:flex;background:var(--surface);border-radius:10px;padding:3px;gap:2px;flex:none}
.modes button{border:0;background:none;border-radius:8px;padding:6px 8px;color:var(--muted);display:flex}
.modes button[aria-pressed="true"]{background:var(--bg);color:var(--link);box-shadow:0 1px 3px rgba(36,20,84,.15)}
.modes svg{width:18px;height:18px}
.iconbtn{border:0;background:var(--surface);border-radius:10px;width:36px;height:36px;display:grid;place-items:center;flex:none;position:relative;color:var(--fg)}
.iconbtn svg{width:19px;height:19px}
.iconbtn .badge{left:auto;right:-4px;top:-4px}
.art{background:radial-gradient(120% 90% at 50% 100%,var(--lav-soft),var(--surface));display:grid;place-items:center;position:relative;overflow:hidden}
.art svg{width:90%}
.art img{width:100%;height:100%;object-fit:cover;display:block}
.credit{position:absolute;right:6px;bottom:4px;font-size:9px;color:#fff;background:rgba(0,0,0,.4);padding:1px 5px;border-radius:4px}
.stack{position:relative;height:462px;margin-top:2px}
.scard{position:absolute;inset:0;background:var(--card);border-radius:20px;border:1px solid var(--line);box-shadow:0 10px 30px -14px rgba(36,20,84,.35);overflow:hidden;display:flex;flex-direction:column;touch-action:pan-y;user-select:none}
.scard.back{transform:scale(.95) translateY(12px);opacity:.75}
.scard .art{height:220px;flex:none}
.stamp{position:absolute;top:18px;padding:4px 10px;border:3px solid;border-radius:8px;font-weight:800;font-size:20px;opacity:0;letter-spacing:1px;z-index:3}
.stamp.like{left:16px;color:var(--mint);border-color:var(--mint);transform:rotate(-12deg)}
.stamp.nope{right:16px;color:var(--danger);border-color:var(--danger);transform:rotate(12deg)}
.tags{position:absolute;left:12px;top:12px;display:flex;gap:6px;flex-wrap:wrap;z-index:2;right:12px}
.tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--bg);color:var(--fg)}
.tag.ok{background:var(--mint);color:#fff}
.tag.pre{background:var(--indigo);color:#fff}
.tag.ad{background:#FFF1C9;color:#6B4C00}
.tag.match{background:var(--violet);color:#fff}
.sbody{padding:14px 16px;display:flex;flex-direction:column;gap:7px;flex:1;min-height:0}
.sbody h2{margin:0;font-size:20px;line-height:1.15}
.specs{font-size:13px;color:var(--muted);line-height:1.45}
.price{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:auto}
.pay{font-size:22px;font-weight:800;color:var(--link);font-variant-numeric:tabular-nums}
.pay small{font-size:13px;font-weight:600}
.terms{font-size:11.5px;color:var(--muted)}
.terms.warn{color:var(--warn);font-weight:600}
.full{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right;flex:none}
.actions{display:flex;justify-content:center;gap:18px;margin-top:6px}
.round{width:60px;height:60px;border-radius:50%;border:1px solid var(--line);background:var(--bg);display:grid;place-items:center;box-shadow:0 6px 14px -8px rgba(36,20,84,.4);transition:transform .12s}
.round:active{transform:scale(.9)}
.round.small{width:46px;height:46px;margin-top:7px}
.round svg{width:26px;height:26px}
.round.small svg{width:20px;height:20px}
.round.no{color:var(--danger)} .round.yes{color:var(--mint)} .round.undo{color:var(--muted)}
.feed{display:flex;flex-direction:column;gap:12px}
.fcard{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;position:relative}
.fcard.dim{opacity:.5}
.fcard .open{border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column;width:100%}
.fcard .art{height:150px}
.fcard .body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px}
.fcard h3{margin:0;font-size:16px}
.heart{position:absolute;right:10px;top:10px;width:34px;height:34px;border-radius:50%;border:0;background:var(--bg);display:grid;place-items:center;color:var(--muted);z-index:4}
.heart[aria-pressed="true"]{color:#fff;background:var(--violet)}
.heart svg{width:18px;height:18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid .fcard .art{height:96px}
.grid .fcard h3{font-size:14px}
.grid .pay{font-size:16px}
.grid .heart{width:30px;height:30px;right:6px;top:6px}
.sortrow{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
.sortrow select{border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:var(--bg);font-size:13px}
.hero{background:var(--violet);color:#fff;border-radius:18px;padding:16px;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:8px}
.hero h2{margin:0;font-size:20px;max-width:72%;line-height:1.2}
.hero p{margin:0;font-size:13px;opacity:.88;max-width:74%}
.hero .btn{background:#fff;color:var(--violet);width:auto;align-self:flex-start;padding:9px 14px;font-size:14px}
.mosaic{position:absolute;right:-6px;top:-6px;display:grid;grid-template-columns:repeat(4,18px)}
.mosaic i{width:18px;height:18px;display:block}
.smart{display:flex;gap:12px;align-items:center;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:12px 14px;text-align:left;width:100%}
.smart .ic{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--violet),var(--violet-2));display:grid;place-items:center;color:#fff;flex:none}
.smart .ic svg{width:22px;height:22px}
.smart b{display:block;font-size:15px}
.smart small{color:var(--muted);font-size:12.5px}
.sec-title{font-size:15px;font-weight:700;margin:4px 0 -4px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 4px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px}
.tile svg{width:100%;height:30px}
.tile small{color:var(--muted);font-size:10.5px}
.brands{display:flex;flex-wrap:wrap;gap:8px}
label.f,.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.val{font-size:18px;font-weight:700;color:var(--fg);font-variant-numeric:tabular-nums}
.val small{font-size:12.5px;color:var(--muted);font-weight:500}
input[type=range]{width:100%;accent-color:var(--violet)}
.seg{display:flex;background:var(--surface);border-radius:12px;padding:3px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px;font-size:13px;color:var(--muted);font-weight:600}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--fg);box-shadow:0 1px 3px rgba(36,20,84,.15)}
.seg.mini{padding:2px;border-radius:9px} .seg.mini button{padding:4px 10px;font-size:12px;border-radius:7px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card.accent{background:var(--lav-soft);border-color:transparent}
.big{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--link)}
.big small{font-size:15px}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:13.5px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums;width:100%}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
thead th{background:var(--violet);color:#fff;font-weight:600}
tbody tr:nth-child(even) td{background:var(--surface)}
.cmp th:first-child,.cmp td:first-child{position:sticky;left:0;background:var(--bg);z-index:1;color:var(--muted);font-weight:500}
.cmp thead th:first-child{background:var(--violet);color:#fff}
.cmp tbody tr:nth-child(even) td:first-child{background:var(--surface)}
.cmp td.diff{color:var(--link);font-weight:700}
.cmp .pin td{background:var(--lav-soft)!important;font-weight:700}
.cmp .art-cell{padding:4px}
.cmp .art-cell .art{width:120px;height:70px;border-radius:8px}
.overlay{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;z-index:20;animation:slide .24s ease}
.overlay.zoom{animation:zoom .28s cubic-bezier(.2,.8,.2,1)}
@keyframes slide{from{transform:translateX(30px);opacity:.6}to{transform:none;opacity:1}}
@keyframes zoom{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
.scrim{position:absolute;inset:0;background:rgba(20,12,46,.45);z-index:45;display:flex;align-items:flex-end}
.sheet{background:var(--bg);width:100%;max-height:90%;border-radius:20px 20px 0 0;display:flex;flex-direction:column;animation:up .24s ease}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
.sheet .hdr{border-radius:20px 20px 0 0}
.foot{flex:none;padding:12px 16px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.back{border:0;background:var(--surface);border-radius:10px;width:36px;height:36px;display:grid;place-items:center;flex:none;color:var(--fg)}
.back svg{width:20px;height:20px}
.detail-art{height:230px}
.specgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.spec{background:var(--surface);border-radius:10px;padding:8px 10px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:2px;min-width:0}
.spec b{color:var(--fg);font-size:14px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{font-size:12px;background:var(--surface);padding:5px 9px;border-radius:8px}
.disc{font-size:11.5px;color:var(--muted);line-height:1.4;margin:0}
.warnbox{background:rgba(168,100,0,.1);color:var(--warn);border-radius:10px;padding:9px 11px;font-size:12.5px;font-weight:600;line-height:1.35}
.okbox{background:rgba(0,179,134,.12);color:var(--mint);border-radius:10px;padding:9px 11px;font-size:12.5px;font-weight:600}
.filt h4{margin:6px 0 2px;font-size:14px;color:var(--fg)}
.filt .chips{flex-wrap:wrap;overflow:visible}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;font-weight:600;background:none;border:0;padding:0;width:100%;text-align:left}
.switch .tg{width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;flex:none;transition:background .2s}
.switch .tg::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch[aria-checked="true"] .tg{background:var(--violet)}
.switch[aria-checked="true"] .tg::after{transform:translateX(18px)}
.tco-bar{display:flex;height:12px;border-radius:6px;overflow:hidden}
.tco-bar i{display:block;height:100%}
.legend{display:flex;flex-direction:column;gap:6px;font-size:13px}
.legend div{display:flex;align-items:center;gap:8px}
.legend span.v{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums}
.sw{width:10px;height:10px;border-radius:3px;flex:none}
.steps{display:flex;flex-direction:column;margin:0;padding:0;list-style:none}
.steps li{display:flex;gap:12px;align-items:flex-start;padding-bottom:12px;position:relative}
.steps li:not(:last-child)::before{content:"";position:absolute;left:11px;top:24px;bottom:2px;width:2px;background:var(--line)}
.steps li.done:not(:last-child)::before{background:var(--mint)}
.steps .n{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:11px;font-weight:700;flex:none;background:var(--bg);color:var(--muted)}
.steps li.done .n{background:var(--mint);border-color:var(--mint);color:#fff}
.steps li.now .n{border-color:var(--violet);color:var(--link)}
.steps .t{font-size:14px;font-weight:600} .steps .s{font-size:12px;color:var(--muted)}
.steps li.todo .t{color:var(--muted);font-weight:500}
.demo{border:1px dashed var(--violet-2);color:var(--violet-2);background:none;border-radius:10px;padding:9px;font-size:13px;font-weight:600;width:100%}
.ok-ic{width:60px;height:60px;border-radius:50%;background:var(--mint);display:grid;place-items:center;color:#fff;margin:4px auto 0;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.ok-ic svg{width:32px;height:32px}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
.center{text-align:center}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13px}
.check input{width:18px;height:18px;accent-color:var(--violet);flex:none;margin-top:1px}
.inp{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);width:100%;font-size:15px}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slots .chip{justify-content:center}
.list-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.list-item:last-child{border-bottom:0}
.list-item .ic{width:36px;height:36px;border-radius:10px;background:var(--lav-soft);display:grid;place-items:center;color:var(--link);flex:none}
.list-item .ic svg{width:18px;height:18px}
.list-item .grow{flex:1;min-width:0}
.list-item .grow small{display:block;color:var(--muted);font-size:12px}
.pill{font-size:11px;font-weight:700;border-radius:6px;padding:3px 7px;background:var(--surface);color:var(--muted);flex:none}
.pill.ok{background:rgba(0,179,134,.14);color:var(--mint)}
.pill.warn{background:rgba(168,100,0,.14);color:var(--warn)}
.welcome{position:absolute;inset:0;background:var(--violet);color:#fff;display:flex;flex-direction:column;z-index:40;padding:28px 22px 22px;gap:14px;overflow:hidden}
.welcome .mos{display:grid;grid-template-columns:repeat(6,1fr);margin:0 -22px 0 30%}
.welcome .mos i{aspect-ratio:1;display:block;animation:fadeIn .6s ease both}
@keyframes fadeIn{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
